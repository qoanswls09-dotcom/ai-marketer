<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 동네 마케터</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'맑은 고딕',sans-serif;background:#f5f6fa;min-height:100vh}
header{background:#fff;border-bottom:1px solid #eee;padding:16px 24px;display:flex;align-items:center;gap:10px}
header h1{font-size:20px;font-weight:700;color:#2563eb}
header span{font-size:13px;color:#888}
.container{max-width:820px;margin:32px auto;padding:0 16px}
.upload-box{background:#fff;border:2px dashed #2563eb;border-radius:16px;padding:40px;text-align:center;cursor:pointer;margin-bottom:20px}
.upload-box:hover{background:#eff6ff}
.upload-box input{display:none}
.upload-icon{font-size:48px;margin-bottom:12px}
.upload-box h2{font-size:18px;margin-bottom:6px}
.upload-box p{font-size:13px;color:#888;margin-top:4px}
.preview-grid{display:none;margin-bottom:20px}
.preview-grid h3{font-size:14px;color:#374151;margin-bottom:10px;font-weight:600}
.preview-images{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.preview-images img{width:100px;height:100px;object-fit:cover;border-radius:8px;border:2px solid #e5e7eb}
.preview-images img.first{border-color:#2563eb}
#change-btn{background:none;border:1px solid #ddd;border-radius:8px;padding:6px 16px;font-size:13px;cursor:pointer;color:#555}
#generate-btn{width:100%;background:#2563eb;color:#fff;border:none;border-radius:12px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:28px;display:none}
#generate-btn:hover{background:#1d4ed8}
#generate-btn:disabled{background:#93c5fd;cursor:not-allowed}
#loading{display:none;text-align:center;padding:32px}
.spinner{width:40px;height:40px;border:4px solid #e5e7eb;border-top-color:#2563eb;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
#loading p{font-size:14px;color:#888}
#results{display:none}
#results h2{font-size:16px;font-weight:700;margin-bottom:14px;color:#374151}
.reels-section{background:linear-gradient(135deg,#667eea,#764ba2);border-radius:14px;padding:20px;margin-bottom:16px;color:#fff}
.reels-section h3{font-size:15px;font-weight:700;margin-bottom:8px}
.reels-section p{font-size:13px;opacity:.9;margin-bottom:14px}
.reels-btn{background:#fff;color:#764ba2;border:none;border-radius:10px;padding:10px 24px;font-size:14px;font-weight:700;cursor:pointer}
.reels-btn:hover{background:#f3f0ff}
.reels-btn:disabled{opacity:.6;cursor:not-allowed}
#reels-result{margin-top:12px;display:none}
#reels-result video{width:100%;border-radius:10px;max-height:400px}
.platform-section{background:#fff;border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.platform-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.platform-name{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.platform-name span{font-size:22px}
.regenerate-btn{background:#f3f4f6;border:none;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;color:#555}
.regenerate-btn:hover{background:#e5e7eb}
.options-grid{display:flex;flex-direction:column;gap:10px}
.option-card{border:1.5px solid #e5e7eb;border-radius:10px;padding:14px 16px;cursor:pointer;transition:all .2s;position:relative}
.option-card:hover{border-color:#2563eb;background:#eff6ff}
.option-card.selected{border-color:#2563eb;background:#eff6ff}
.option-card.selected::after{content:'✓ 선택됨';position:absolute;top:10px;right:12px;font-size:11px;color:#2563eb;font-weight:700}
.option-num{font-size:11px;color:#9ca3af;margin-bottom:6px;font-weight:600}
.option-text{font-size:13px;color:#374151;line-height:1.9;white-space:pre-wrap;word-break:break-word;max-height:200px;overflow-y:auto}
.option-text.expanded{max-height:none}
.expand-btn{font-size:11px;color:#2563eb;background:none;border:none;cursor:pointer;margin-top:4px;display:block}
.naver-title-text{font-size:13px;font-weight:700;color:#059669;margin-bottom:6px}
.edit-area{width:100%;border:1px solid #e5e7eb;border-radius:8px;padding:10px;font-size:13px;line-height:1.7;margin-top:8px;display:none;resize:vertical;font-family:'맑은 고딕',sans-serif;color:#374151;min-height:120px}
.edit-btn{font-size:11px;color:#6b7280;background:none;border:none;cursor:pointer;margin-top:6px;text-decoration:underline}
.publish-section{background:#fff;border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06);display:none}
.publish-section h3{font-size:15px;font-weight:700;margin-bottom:14px;color:#374151}
.selected-summary{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.summary-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;padding:8px 12px;background:#f9fafb;border-radius:8px}
.summary-icon{font-size:16px;flex-shrink:0}
.summary-text{color:#374151;line-height:1.5}
.publish-btn{width:100%;background:#16a34a;color:#fff;border:none;border-radius:12px;padding:16px;font-size:16px;font-weight:700;cursor:pointer}
.publish-btn:hover{background:#15803d}
#reset-btn{width:100%;background:#f9fafb;border:1px solid #e5e7eb;border-radius:12px;padding:14px;font-size:14px;cursor:pointer;margin-top:8px;color:#555}
.copy-btn{position:absolute;bottom:10px;right:10px;background:#f3f4f6;border:none;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;color:#555}
.copy-btn:hover{background:#e5e7eb}
.copy-btn.copied{background:#dcfce7;color:#16a34a}
</style>
</head>
<body>
<header>
<h1>🏪 AI 동네 마케터</h1>
<span>사진 여러 장으로 SNS 5개 + 릴스 동시 제작</span>
</header>
<div class="container">
<div class="upload-box" id="upload-box" onclick="document.getElementById('file-input').click()">
<input type="file" id="file-input" accept="image/*" multiple onchange="handleFiles(this)">
<div class="upload-icon">📷</div>
<h2>사진을 올려주세요 (여러 장 가능)</h2>
<p>클릭하거나 사진을 끌어다 놓으세요</p>
<p style="margin-top:8px;color:#2563eb;font-size:12px">여러 장 선택 시 블로그 사진 삽입 + 릴스 영상 자동 생성!</p>
</div>
<div class="preview-grid" id="preview-wrap">
<h3>📎 선택된 사진 <span id="photo-count"></span></h3>
<div class="preview-images" id="preview-images"></div>
<button id="change-btn" onclick="resetUpload()">📁 다시 선택</button>
</div>
<button id="generate-btn" onclick="generate()">✨ AI 콘텐츠 생성하기</button>
<div id="loading">
<div class="spinner"></div>
<p id="loading-text">AI가 콘텐츠를 분석하고 있어요...<br>30~60초 정도 걸립니다 😊</p>
</div>
<div id="results">
<h2>📣 마음에 드는 콘텐츠를 선택해주세요!</h2>
<div id="reels-wrap" style="display:none">
<div class="reels-section">
<h3>🎬 릴스 영상 자동 생성</h3>
<p>선택한 사진들로 인스타그램 릴스용 영상을 자동으로 만들어드립니다</p>
<button class="reels-btn" id="reels-btn" onclick="createReels()">🎬 릴스 영상 만들기</button>
<div id="reels-result">
<video controls id="reels-video"></video>
<a id="reels-download" download="reels.mp4" style="display:block;margin-top:8px;text-align:center;color:#fff;font-size:13px;text-decoration:underline">⬇ 영상 다운로드</a>
</div>
</div>
</div>
<div id="platforms"></div>
<div class="publish-section" id="publish-section">
<h3>✅ 선택된 콘텐츠 확인</h3>
<div class="selected-summary" id="selected-summary"></div>
<button class="publish-btn" onclick="publish()">🚀 승인하고 발행하기</button>
</div>
<button id="reset-btn" onclick="resetAll()">🔄 새 사진으로 다시 만들기</button>
</div>
</div>
<script>
let selectedFiles=[];
let contentData=null;
let imagePaths=[];
let selected={instagram:null,threads:null,facebook:null,daangn:null,naver:null};
const platforms=[
{key:'instagram',icon:'📸',name:'인스타그램'},
{key:'threads',icon:'🧵',name:'쓰레드'},
{key:'facebook',icon:'👥',name:'페이스북'},
{key:'daangn',icon:'🥕',name:'당근마켓'},
{key:'naver',icon:'🟢',name:'네이버 블로그'}
];

function handleFiles(input){
const files=Array.from(input.files);
if(!files.length)return;
selectedFiles=files;
document.getElementById('upload-box').style.display='none';
document.getElementById('preview-wrap').style.display='block';
document.getElementById('generate-btn').style.display='block';
document.getElementById('photo-count').textContent=`(${files.length}장)`;
const grid=document.getElementById('preview-images');
grid.innerHTML='';
files.forEach((f,i)=>{
const img=document.createElement('img');
img.src=URL.createObjectURL(f);
if(i===0)img.classList.add('first');
grid.appendChild(img);
});
}

async function generate(){
if(!selectedFiles.length)return;
const btn=document.getElementById('generate-btn');
btn.disabled=true;
document.getElementById('loading').style.display='block';
document.getElementById('results').style.display='none';
document.getElementById('loading-text').innerHTML=`AI가 ${selectedFiles.length}장의 사진을 분석하고 있어요...<br>30~60초 정도 걸립니다 😊`;
const formData=new FormData();
selectedFiles.forEach(f=>formData.append('images',f));
try{
const res=await fetch('/generate',{method:'POST',body:formData});
const data=await res.json();
if(data.success){
contentData=data.content;
imagePaths=data.imagePaths||[];
renderPlatforms();
if(selectedFiles.length>1){
document.getElementById('reels-wrap').style.display='block';
}
document.getElementById('loading').style.display='none';
document.getElementById('results').style.display='block';
}else{
alert('오류: '+data.error);
}
}catch(e){
alert('서버 연결 오류.');
}
btn.disabled=false;
document.getElementById('loading').style.display='none';
}

function renderPlatforms(){
const container=document.getElementById('platforms');
container.innerHTML='';
selected={instagram:null,threads:null,facebook:null,daangn:null,naver:null};
platforms.forEach(p=>{
const items=contentData[p.key];
let optionsHtml='';
items.forEach((item,i)=>{
const textContent=p.key==='naver'?
`<div class="naver-title-text">📌 ${item.title}</div><div class="option-text" id="text-${p.key}-${i}">${item.content}</div>`:
`<div class="option-text" id="text-${p.key}-${i}">${item}</div>`;
optionsHtml+=`
<div class="option-card" id="${p.key}-${i}" onclick="selectOption('${p.key}',${i})">
<div class="option-num">제안 ${i+1} ${i===0?'⭐ 추천':''}</div>
${textContent}
<button class="expand-btn" onclick="event.stopPropagation();toggleExpand('text-${p.key}-${i}',this)">▼ 더 보기</button>
<button class="edit-btn" onclick="event.stopPropagation();toggleEdit('${p.key}-edit-${i}')">✏️ 직접 수정</button>
<button class="copy-btn" onclick="event.stopPropagation();copyText('text-${p.key}-${i}',this)">복사</button>
<textarea class="edit-area" id="${p.key}-edit-${i}" onchange="updateEdit('${p.key}',${i},this.value)">${p.key==='naver'?item.title+'\n\n'+item.content:item}</textarea>
</div>`;
});
container.innerHTML+=`
<div class="platform-section">
<div class="platform-header">
<div class="platform-name"><span>${p.icon}</span>${p.name}</div>
<button class="regenerate-btn" onclick="regenerate('${p.key}',this)">🔄 다시 제안</button>
</div>
<div class="options-grid">${optionsHtml}</div>
</div>`;
});
}

function toggleExpand(id,btn){
const el=document.getElementById(id);
if(el.classList.contains('expanded')){
el.classList.remove('expanded');
btn.textContent='▼ 더 보기';
}else{
el.classList.add('expanded');
btn.textContent='▲ 접기';
}
}

function selectOption(platform,index){
selected[platform]=index;
document.querySelectorAll(`[id^="${platform}-"]`).forEach(el=>{
if(el.classList.contains('option-card'))el.classList.remove('selected');
});
document.getElementById(`${platform}-${index}`).classList.add('selected');
updatePublishSection();
}

function toggleEdit(id){
const el=document.getElementById(id);
el.style.display=el.style.display==='none'||el.style.display===''?'block':'none';
}

function copyText(id,btn){
const el=document.getElementById(id);
navigator.clipboard.writeText(el.textContent).then(()=>{
btn.textContent='✅ 복사됨';
btn.classList.add('copied');
setTimeout(()=>{btn.textContent='복사';btn.classList.remove('copied');},2000);
});
}

function updateEdit(platform,index,value){
if(platform==='naver'){
const lines=value.split('\n\n');
contentData[platform][index].title=lines[0]||'';
contentData[platform][index].content=lines.slice(1).join('\n\n')||'';
}else{
contentData[platform][index]=value;
}
}

async function regenerate(platform,btn){
if(!selectedFiles.length)return;
btn.textContent='생성 중...';
btn.disabled=true;
const formData=new FormData();
selectedFiles.forEach(f=>formData.append('images',f));
try{
const res=await fetch('/generate',{method:'POST',body:formData});
const data=await res.json();
if(data.success){
contentData[platform]=data.content[platform];
selected[platform]=null;
renderPlatforms();
}
}catch(e){alert('오류 발생');}
btn.textContent='🔄 다시 제안';
btn.disabled=false;
}

async function createReels(){
const btn=document.getElementById('reels-btn');
btn.disabled=true;
btn.textContent='🎬 영상 생성 중... (1~2분)';
try{
const res=await fetch('/create-reels',{
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify({imagePaths})
});
const data=await res.json();
if(data.success){
const video=document.getElementById('reels-video');
const dl=document.getElementById('reels-download');
video.src=data.videoUrl;
dl.href=data.videoUrl;
document.getElementById('reels-result').style.display='block';
btn.textContent='✅ 영상 완성!';
}else{
alert('릴스 생성 오류: '+data.error);
btn.textContent='🎬 릴스 영상 만들기';
btn.disabled=false;
}
}catch(e){
alert('오류 발생');
btn.textContent='🎬 릴스 영상 만들기';
btn.disabled=false;
}
}

function updatePublishSection(){
const section=document.getElementById('publish-section');
const summary=document.getElementById('selected-summary');
summary.innerHTML='';
platforms.forEach(p=>{
if(selected[p.key]!==null){
const item=contentData[p.key][selected[p.key]];
const text=p.key==='naver'?item.title:item;
summary.innerHTML+=`<div class="summary-item"><span class="summary-icon">${p.icon}</span><div class="summary-text">${text.substring(0,80)}...</div></div>`;
}
});
section.style.display=Object.values(selected).some(v=>v!==null)?'block':'none';
}

function publish(){
const missing=platforms.filter(p=>selected[p.key]===null).map(p=>p.name);
if(missing.length>0){
alert('아직 선택 안 한 플랫폼:\n'+missing.join(', ')+'\n\n모두 선택 후 발행해주세요!');
return;
}
alert('✅ 승인 완료!\n\nMeta API 연동 완료 후 자동 발행됩니다.\n지금은 복사 버튼으로 각 플랫폼에 붙여넣기 해주세요!');
}

function resetUpload(){
document.getElementById('file-input').value='';
document.getElementById('upload-box').style.display='block';
document.getElementById('preview-wrap').style.display='none';
document.getElementById('generate-btn').style.display='none';
selectedFiles=[];
}

function resetAll(){
resetUpload();
document.getElementById('results').style.display='none';
document.getElementById('reels-wrap').style.display='none';
}
</script>
</body>
</html>
